name: Weekly SEO Audit

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight
  workflow_dispatch:

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 pandas requests concurrent-log-handler

    - name: Run SEO Audit
      run: |
        python scripts/seo_audit.py
        python scripts/content_optimizer.py
        
    - name: Upload results
      uses: actions/upload-artifact@v3
      with:
        name: seo-results
        path: |
          seo_audit_results.csv
          content_recommendations.md
        
    - name: Create issue with findings
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('content_recommendations.md', 'utf8');
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Weekly SEO Audit Report',
            body: report,
            labels: ['seo', 'audit']
          });